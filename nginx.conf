server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Atrás do cloudflared: o TLS termina na Cloudflare.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Bundles e assets têm hash no nome: cache longo.
  location /_expo/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location /assets/ { expires 30d; add_header Cache-Control "public"; }

  # Rota dinâmica do expo-router (historicoDetalhes/[id])
  location ~ ^/historicoDetalhes/[^/.]+/?$ {
    try_files /historicoDetalhes/[id].html =404;
  }

  # Páginas estáticas (/home -> home.html); HTML sempre revalidado
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri.html $uri/ /index.html;
  }
}
